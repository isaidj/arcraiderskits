name: Validate & Sync Arc Raiders Data

on:
  # Ejecutar automáticamente cada día a las 2 AM UTC
  schedule:
    - cron: '0 2 * * *'
  
  # Permitir ejecución manual
  workflow_dispatch:
  
  # Ejecutar en cada push a main (opcional)
  # push:
  #   branches: [ main ]

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Validate sync status
        id: validate
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run validate-sync
      
      - name: Sync data if needed
        if: steps.validate.outcome == 'failure'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync-data
      
      - name: Create summary
        if: always()
        run: |
          echo "## 📊 Sync Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.validate.outcome }}" == "success" ]; then
            echo "✅ Database is in sync with repository" >> $GITHUB_STEP_SUMMARY
          else
            echo "🔄 Database was out of sync and has been updated" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
      
      - name: Send Discord notification (optional)
        if: steps.validate.outcome == 'failure' && secrets.DISCORD_WEBHOOK_URL
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: |
            🔄 **Arc Raiders Data Updated**
            
            The database has been synchronized with the latest Arc Raiders data.
            
            **Repository:** ${{ github.repository }}
            **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
